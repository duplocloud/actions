name: 'AI HelpDesk Ticket'
description: 'Creates a HelpDesk ticket for AI analysis when workflows fail'
author: 'duplocloud'
branding:
  icon: 'ticket'
  color: 'blue'
inputs:
  title:
    description: 'Ticket title. Defaults to "Workflow Failure: {workflow_name}" if not provided'
    required: false
    default: ''
  context:
    description: 'Contextual header section. Defaults to auto-generated workflow details if not provided'
    required: false
    default: ''
  content:
    description: 'Additional content appended after the context section'
    required: false
    default: ''
  include_sensitive_data:
    description: Whether to include sensitive data (repository, actor, branch, commit) in ticket context
    required: false
    default: 'true'
  hide_response:
    description: 'Hide the agent response in the summary. Response is shown by default.'
    required: false
    default: 'false'
  agent_name:
    description: 'Name of the AI agent to handle the ticket. One of agent_name or agent_id is required.'
    required: false
    default: ''
  agent_id:
    description: 'Id of the AI agent to handle the ticket. Skips the agent name lookup when provided.'
    required: false
    default: ''
  workspace:
    description: >-
      AI HelpDesk workspace name to create the ticket in. Falls back to the
      DUPLO_WORKSPACE environment variable. One of workspace or workspace_id
      is required (via input or environment).
    required: false
    default: ''
  workspace_id:
    description: >-
      AI HelpDesk workspace id. Skips the workspace name lookup when provided.
      Falls back to the DUPLO_WORKSPACE_ID environment variable.
    required: false
    default: ''

runs:
  using: composite
  steps:

  - name: Prepare Ticket Data
    id: prepare-ticket
    shell: bash
    env:
      TITLE: ${{ inputs.title }}
      CONTEXT: ${{ inputs.context }}
      CONTENT: ${{ inputs.content }}
      INCLUDE_SENSITIVE_DATA: ${{ inputs.include_sensitive_data }}
      AGENT_NAME: ${{ inputs.agent_name }}
      AGENT_ID: ${{ inputs.agent_id }}
      WORKSPACE: ${{ inputs.workspace }}
      WORKSPACE_ID: ${{ inputs.workspace_id }}
    run: |
      # Validate required environment variables. The ticket API is
      # workspace-scoped, so a workspace selector replaces the old
      # DUPLO_TENANT requirement; this works against both an integrated
      # portal and a standalone AI HelpDesk (dahp_ token).
      if [ -z "${DUPLO_HOST:-}" ] || [ -z "${DUPLO_TOKEN:-}" ]; then
        echo "::error::DUPLO_HOST and DUPLO_TOKEN must be set. Run the Duplo Setup action first."
        exit 1
      fi

      # Validate duploctl is available
      if ! command -v duploctl &> /dev/null; then
        echo "::error::duploctl command not found. Run the Duplo Setup action first."
        exit 1
      fi

      # Resolve the workspace selector from inputs or the environment
      WORKSPACE="${WORKSPACE:-${DUPLO_WORKSPACE:-}}"
      WORKSPACE_ID="${WORKSPACE_ID:-${DUPLO_WORKSPACE_ID:-}}"
      if [ -z "$WORKSPACE" ] && [ -z "$WORKSPACE_ID" ]; then
        echo "::error::One of workspace or workspace_id is required (input or DUPLO_WORKSPACE / DUPLO_WORKSPACE_ID environment variable)."
        exit 1
      fi

      if [ -z "$AGENT_NAME" ] && [ -z "$AGENT_ID" ]; then
        echo "::error::One of agent_name or agent_id is required."
        exit 1
      fi

      # Build title
      if [ -n "$TITLE" ]; then
        TICKET_TITLE="$TITLE"
      else
        TICKET_TITLE="Workflow Failure: $GITHUB_WORKFLOW"
      fi

      # Build context
      if [ -n "$CONTEXT" ]; then
        TICKET_CONTEXT="$CONTEXT"
      else
        # Build default context cleanly
        if [ "$INCLUDE_SENSITIVE_DATA" = "true" ]; then
          TICKET_CONTEXT=$(
            echo "GitHub Actions workflow failure detected!"
            echo ""
            echo "Workflow Details:"
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Workflow: $GITHUB_WORKFLOW"
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Commit: $GITHUB_SHA"
            echo "- Actor: $GITHUB_ACTOR"
            echo "- Branch: $GITHUB_REF_NAME"
            echo "- Event: $GITHUB_EVENT_NAME"
            echo "- Run URL: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
          )
        else
          TICKET_CONTEXT=$(
            echo "GitHub Actions workflow failure detected!"
            echo ""
            echo "Workflow Details:"
            echo "- Workflow: $GITHUB_WORKFLOW"
            echo "- Run ID: $GITHUB_RUN_ID"
            echo "- Event: $GITHUB_EVENT_NAME"
            echo ""
          )
        fi
      fi

      # Build final message
      if [ -n "$CONTENT" ]; then
        TICKET_MESSAGE="$TICKET_CONTEXT$CONTENT"
      else
        TICKET_MESSAGE="$TICKET_CONTEXT"
      fi

      # Set outputs for next step
      {
        echo "ticket_title=$TICKET_TITLE"
        echo "workspace=$WORKSPACE"
        echo "workspace_id=$WORKSPACE_ID"
        echo "ticket_message<<EOF"
        echo "$TICKET_MESSAGE"
        echo "EOF"
      } >> $GITHUB_OUTPUT

  - name: Create HelpDesk Ticket
    id: duploctl-create-ticket
    shell: bash
    env:
      TICKET_TITLE: ${{ steps.prepare-ticket.outputs.ticket_title }}
      TICKET_MESSAGE: ${{ steps.prepare-ticket.outputs.ticket_message }}
      AGENT_NAME: ${{ inputs.agent_name }}
      AGENT_ID: ${{ inputs.agent_id }}
      WORKSPACE: ${{ steps.prepare-ticket.outputs.workspace }}
      WORKSPACE_ID: ${{ steps.prepare-ticket.outputs.workspace_id }}
    run: |
      ARGS=(--origin pipelines --title "$TICKET_TITLE" --message "$TICKET_MESSAGE")
      if [ -n "$AGENT_ID" ]; then
        ARGS+=(--agent_id "$AGENT_ID")
      else
        ARGS+=(--agent_name "$AGENT_NAME")
      fi
      if [ -n "$WORKSPACE_ID" ]; then
        ARGS+=(--workspace-id "$WORKSPACE_ID")
      else
        ARGS+=(--workspace "$WORKSPACE")
      fi
      # stdout carries the JSON result only; duploctl logs go to stderr so
      # the next step can parse the file with jq.
      duploctl ticket create_ticket "${ARGS[@]}" -o json > /tmp/duploctl_output.json

  - name: Build Step Summary
    shell: bash
    env:
      AGENT_NAME: ${{ inputs.agent_name }}
      AGENT_ID: ${{ inputs.agent_id }}
      WORKSPACE: ${{ steps.prepare-ticket.outputs.workspace }}
      WORKSPACE_ID: ${{ steps.prepare-ticket.outputs.workspace_id }}
      HIDE_RESPONSE: ${{ inputs.hide_response }}
    run: |
      TICKET_NAME=$(jq -r '.ticketname // empty' /tmp/duploctl_output.json 2>/dev/null || echo "")
      CHAT_URL=$(jq -r '.chat_url // empty' /tmp/duploctl_output.json 2>/dev/null || echo "")

      echo "# AI HelpDesk Ticket Created" > $GITHUB_STEP_SUMMARY
      [ -n "$CHAT_URL" ] && echo "**Chat URL:** [$CHAT_URL]($CHAT_URL)" >> $GITHUB_STEP_SUMMARY
      [ -n "$TICKET_NAME" ] && echo "**Ticket:** \`$TICKET_NAME\`" >> $GITHUB_STEP_SUMMARY
      echo "**Agent:** \`${AGENT_NAME:-$AGENT_ID}\`" >> $GITHUB_STEP_SUMMARY
      echo "**Workspace:** \`${WORKSPACE:-$WORKSPACE_ID}\`" >> $GITHUB_STEP_SUMMARY
      echo "" >> $GITHUB_STEP_SUMMARY

      if [ "$HIDE_RESPONSE" != "true" ]; then
        AGENT_RESPONSE=$(jq -r '.ai_response // empty' /tmp/duploctl_output.json 2>/dev/null || echo "")

        if [ -n "$AGENT_RESPONSE" ]; then
          echo "$AGENT_RESPONSE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Open the [HelpDesk ticket]($CHAT_URL) to continue the conversation.**" >> $GITHUB_STEP_SUMMARY
        fi
      fi

      echo "AI HelpDesk ticket created successfully"
      cat /tmp/duploctl_output.json
