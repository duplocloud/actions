name: DuploCloud Login
description: Exchange a GitHub OIDC JWT for a short-lived HelpDesk API token and export DUPLO_TOKEN for subsequent steps.
author: duplocloud
branding:
  icon: key
  color: orange
inputs:
  trust_name:
    description: Name of the OIDC trust configured in AI HelpDesk.
    required: true
  audience:
    description: Exact audience configured in the OIDC trust. Defaults to DUPLO_HOST without trailing slashes.
    required: false
outputs:
  expires_in:
    description: Lifetime of the generated API token in seconds, starting at issuance.
runs:
  using: node24
  main: index.cjs
