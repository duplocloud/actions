name: Test release-extension

on:
  pull_request:
    paths:
      - 'release-extension/**'
      - '.github/workflows/test-release-extension.yml'
  push:
    branches: [main]
    paths:
      - 'release-extension/**'
      - '.github/workflows/test-release-extension.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install the signer's dependencies
        run: pip install --require-hashes -r release-extension/scripts/extension-sign.requirements.txt
      - name: Run the tests
        run: release-extension/tests/run.sh
